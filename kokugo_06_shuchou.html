  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function normPw(s) { return s.normalize('NFKC').trim().toLowerCase().replace(/\s/g, ''); }
  async function unlock(pw, auto) {
    try {
      var k0 = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.s), iterations: D.n, hash: 'SHA-256' }, k0, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.i) }, k, b64(D.c));
      try { localStorage.setItem('haru-aikotoba', pw); } catch (e) {}
      var html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
      return true;
    } catch (e) {
      if (!auto) document.getElementById('msg').textContent = 'ちがうみたい。もう一度 入れてね。';
      return false;

  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });

    var s = null; try { s = localStorage.getItem('haru-aikotoba'); } catch (e) {}

    document.body.classList.add('ready'); input.focus();
